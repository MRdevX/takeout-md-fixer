name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # main.go embeds frontend/dist; dist is gitignored, so it must exist before vet/test compile main.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::frontend/package-lock.json missing from checkout — run 'cd frontend && npm install' and commit package-lock.json. Using npm install for this run."
            npm install --no-audit --no-fund
          fi
          npm run build

      # Wails v3 pulls Linux webview code that needs GTK/WebKit headers (pkg-config).
      # See: https://github.com/wailsapp/wails/blob/v3-alpha/.github/workflows/build-and-test-v3.yml
      - name: Install Linux dependencies (GTK3 / WebKit2GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libwayland-dev

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          args: ./internal/... .
